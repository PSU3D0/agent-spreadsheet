[package]
name = "agent-spreadsheet-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM-facing byte/session API wrapper for agent-spreadsheet"
license = "Apache-2.0"
publish = false

# wasm-pack runs `wasm-opt` with these arguments for each profile it can build.
# The size lane is `--profile wasm-release` (see the workspace `[profile.wasm-release]`).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]

[package.metadata.wasm-pack.profile.wasm-release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
agent-spreadsheet = { path = "../agent-spreadsheet", default-features = false, features = ["recalc-formualizer"] }

[features]
# The in-process raster renderer. Compiling it in is what makes
# `screenshot_rendering` available to the byte/session adapter, and what the
# `screenshot_sheet` interception below is gated on.
default = ["render"]
render = ["agent-spreadsheet/render"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
umya-spreadsheet = "=3.1.0"
tokio = { version = "1.37", features = ["macros", "rt"] }
tempfile = "3.10"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
