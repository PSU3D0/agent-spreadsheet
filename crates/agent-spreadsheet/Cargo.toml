[package]
name = "agent-spreadsheet"
version = "0.15.0"
edition = "2024"
description = "Core spreadsheet automation primitives — shared types, edit normalization, and session traits for agent-facing surfaces"
authors = ["Frankie Colson"]
repository = "https://github.com/PSU3D0/agent-spreadsheet"
homepage = "https://github.com/PSU3D0/agent-spreadsheet"
license = "Apache-2.0"
readme = "README.md"
keywords = ["spreadsheet", "xlsx", "automation", "agent", "mcp"]
categories = ["data-structures", "parser-implementations"]

[package.metadata.binstall]
# Archives (>= v0.13) contain both declared bins: agent-spreadsheet and asp.
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/agent-spreadsheet-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/agent-spreadsheet-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/agent-spreadsheet-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/agent-spreadsheet-macos-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/agent-spreadsheet-windows-x86_64.zip"


[[bin]]
name = "agent-spreadsheet"
path = "src/bin/agent-spreadsheet.rs"
required-features = ["recalc", "cli"]

[[bin]]
name = "asp"
path = "src/bin/asp.rs"
required-features = ["recalc", "cli"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.8"
serde_yaml = { version = "0.9", optional = true }
tokio = { version = "1.37", features = ["macros", "rt", "sync", "time"] }
parking_lot = "0.12"
lru = "0.12"
ahash = "0.8"
smallvec = "1.13"
umya-spreadsheet = "2.3.2"
ovba = "0.7.1"
formualizer-parse = { version = "3.1.1" }
formualizer = { version = "0.9.0", default-features = false, features = ["eval", "workbook", "umya", "common"], optional = true }
web-time = "1.1"
walkdir = { version = "2.5", optional = true }
globset = { version = "0.4", optional = true }
rand = "0.8"
sha2 = "0.10"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2.2"
regex = "1.10"
strum = { version = "0.26", features = ["derive"] }
schemars = { version = "1.0", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
base64 = { version = "0.22", optional = true }
async-trait = { version = "0.1", optional = true }
uuid = { version = "1.10", features = ["v4", "js"], optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
agent-spreadsheet-render = { version = "0.15.0", path = "../agent-spreadsheet-render", optional = true }
quick-xml = { version = "0.31", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh64"], optional = true }
tempfile = { version = "3.10", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "fs", "signal", "net", "process"] }
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
umya-spreadsheet = { version = "2.3.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
formualizer = { version = "0.9.0", default-features = false, features = ["js-runtime"], optional = true }

[features]
# Native consumers get the historical surface: recalc + CLI arg parsing + a
# real filesystem. The wasm32 byte/session adapter opts out of `cli` and
# `native-fs` so clap, serde_yaml, tracing-subscriber, walkdir, globset and
# tempfile are never compiled for the browser bundle.
default = ["recalc-formualizer", "sheetport", "cli", "native-fs", "render"]

# Human/argv surface: clap arg definitions, YAML config files, log formatting.
cli = ["native-fs", "dep:clap", "dep:serde_yaml", "dep:tracing-subscriber"]

# Host filesystem surface: path-backed workspace discovery, temp-file staging.
native-fs = ["dep:tempfile", "dep:walkdir", "dep:globset"]

recalc = ["async-trait", "uuid", "quick-xml", "xxhash-rust"]
recalc-formualizer = ["recalc", "dep:formualizer"]
# SheetPort manifests. `formualizer/sheetport` drags `sheetport-spec` in, which
# carries its own clap/serde_yaml CLI surface; the wasm bundle does not need it.
sheetport = ["recalc-formualizer", "formualizer/sheetport"]
# Screenshot/PNG post-processing is LibreOffice-only, so image/png stay out of
# the default and wasm builds.
recalc-libreoffice = ["recalc", "native-fs", "dep:image", "dep:base64"]
# The native raster screenshot backend. Compiling it in is what makes
# `screenshot_rendering` available without LibreOffice.
render = ["dep:agent-spreadsheet-render"]

[dev-dependencies]
assert_cmd = "2.0"
