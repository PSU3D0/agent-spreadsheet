name: Publish npm @formualizer/mcp

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (defaults to npm/formualizer-mcp/package.json version)'
        required: false
        type: string

jobs:
  publish-formualizer-mcp:
    name: Publish @formualizer/mcp & Official MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve and verify version
        id: ver
        working-directory: npm/formualizer-mcp
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_VER="${{ inputs.version || '' }}"
            if [ -z "$TARGET_VER" ]; then
              TARGET_VER="$PKG_VER"
            fi
          else
            TARGET_VER="${GITHUB_REF_NAME#mcp-v}"
          fi
          test "$TARGET_VER" = "$PKG_VER"
          echo "version=${TARGET_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved @formualizer/mcp version: ${TARGET_VER}"

      - name: Build and verify package
        working-directory: npm/formualizer-mcp
        run: |
          npm run build
          npm pack --dry-run

      - name: Smoke test bundled stdio MCP binary
        working-directory: npm/formualizer-mcp
        run: |
          node --input-type=module -e '
            import { spawn } from "node:child_process";
            const proc = spawn("node", ["./bin/formualizer-mcp.mjs"], { stdio: ["pipe", "pipe", "pipe"] });
            let out = "";
            proc.stdout.on("data", d => out += d.toString());
            proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "ci", version: "1" } } }) + "\n");
            proc.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} }) + "\n");
            setTimeout(() => {
              proc.kill();
              const msgs = out.trim().split("\n").map(l => JSON.parse(l));
              if (msgs.length !== 2 || msgs[1].result.tools.length !== 4) {
                console.error("Unexpected MCP smoke output:", out);
                process.exit(1);
              }
              console.log("MCP smoke OK:", msgs[1].result.tools.map(t => t.name));
            }, 1000);
          '

      - name: Publish @formualizer/mcp to npm (if not already published)
        working-directory: npm/formualizer-mcp
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@formualizer/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@formualizer/mcp@${VERSION} is already published on npm; skipping npm publish"
          else
            npm publish --access public --provenance
          fi

      - name: Publish io.github.PSU3D0/formualizer to Official MCP Registry
        working-directory: plugins/formualizer
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for attempt in $(seq 1 12); do
            if npm view "@formualizer/mcp@${VERSION}" mcpName >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz -C /tmp mcp-publisher
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
