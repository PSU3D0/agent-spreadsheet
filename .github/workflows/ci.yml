name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux
            binary_path: target/release/agent-spreadsheet-mcp
          - os: macos-latest
            artifact_suffix: macos
            binary_path: target/release/agent-spreadsheet-mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked -p agent-spreadsheet-mcp -p agent-spreadsheet

      - name: Upload MCP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-spreadsheet-mcp-${{ matrix.artifact_suffix }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

      - name: Upload CLI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-spreadsheet-${{ matrix.artifact_suffix }}
          path: target/release/agent-spreadsheet
          if-no-files-found: error

  registry-metadata:
    name: Registry metadata checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local MCP registry metadata
        run: python3 scripts/validate_registry_metadata.py

      - name: Validate server.json with official MCP Registry
        run: |
          curl --fail --show-error --silent \
            --header 'Content-Type: application/json' \
            --data @server.json \
            https://registry.modelcontextprotocol.io/v0.1/validate

  sdk-parity:
    name: SDK parity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sdk-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Build the MCP server for the SDK server-runtime integration
        run: cargo build --locked -p agent-spreadsheet-mcp -p agent-spreadsheet

      - name: Run SDK tests and generated WASM integration
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
          node scripts/run-generated-wasm-integration.js --rebuild
          npm test
          npm run test:server
          npm pack --dry-run
        working-directory: npm/agent-spreadsheet-sdk
        env:
          SPREADSHEET_MCP_BINARY: ${{ github.workspace }}/target/debug/agent-spreadsheet-mcp
          ASP_BINARY: ${{ github.workspace }}/target/debug/asp
          AGENT_SPREADSHEET_WASM_PACKAGE: ${{ github.workspace }}/target/sdk-wasm-node

      - name: Run parity harness
        run: node scripts/parity-harness.js

  wasm-browser:
    name: Browser WASM Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Set up pinned Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 149.0.7827.155

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install SDK browser tooling
        run: npm install --ignore-scripts --package-lock=false
        working-directory: npm/agent-spreadsheet-sdk

      - name: Build web WASM package
        run: |
          node scripts/build-wasm-package.js \
            --target web --profile wasm-release --no-opt \
            --out-dir "$PWD/target/sdk-wasm-web"

      - name: Run actual-browser WASM integration
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser
        working-directory: npm/agent-spreadsheet-sdk

  wasm-size-gate:
    name: WASM Size Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-size-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install binaryen
        run: |
          set -euo pipefail
          version=version_123
          curl --fail --location --silent --show-error \
            "https://github.com/WebAssembly/binaryen/releases/download/${version}/binaryen-${version}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-${version}/bin/wasm-opt" >> "$GITHUB_ENV"

      - name: Check release web bundle against the size budget
        run: node scripts/check-wasm-size.js

  wasm-npm-package:
    name: WASM npm package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-npm-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Build and smoke test the npm package
        run: |
          npm run build
          npm test
          npm pack --dry-run
        working-directory: npm/agent-spreadsheet-wasm

      - name: Exercise published web bindings and SDK in Chromium and a Web Worker
        run: |
          npm ci --ignore-scripts --prefix npm/agent-spreadsheet-sdk
          npm run build --prefix npm/agent-spreadsheet-sdk
          node scripts/browser-smoke.mjs

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run docker integration tests
        run: cargo test -p agent-spreadsheet-mcp --test recalc_docker --locked --features docker-tests
