name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts without releasing or publishing
        type: boolean
        default: true


env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary_extension: ""
            archive_extension: .tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
            binary_extension: ""
            archive_extension: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            binary_extension: ""
            archive_extension: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary_extension: ""
            archive_extension: .tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p agent-spreadsheet-mcp -p agent-spreadsheet

      - name: Prepare raw binaries and archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          release_dir="target/${{ matrix.target }}/release"
          for binary in agent-spreadsheet agent-spreadsheet-mcp; do
            source_name="${binary}${{ matrix.binary_extension }}"
            asset_name="${binary}-${{ matrix.asset_suffix }}${{ matrix.binary_extension }}"
            cp "${release_dir}/${source_name}" "dist/${asset_name}"
            archive_members="$source_name"
            if [[ "$binary" == "agent-spreadsheet" ]]; then
              # CLI archives carry both bin names so cargo-binstall (pkg-fmt tgz/zip)
              # can materialize the crate's two declared bins.
              archive_members="$source_name asp${{ matrix.binary_extension }}"
            fi
            if [[ "${{ matrix.archive_extension }}" == ".zip" ]]; then
              (cd "$release_dir" && 7z a "$GITHUB_WORKSPACE/dist/${binary}-${{ matrix.asset_suffix }}.zip" $archive_members)
            else
              tar -czf "dist/${binary}-${{ matrix.asset_suffix }}.tar.gz" -C "$release_dir" $archive_members
            fi
          done

      - name: Upload target release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Prepare Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  publish:
    name: Publish to crates.io
    needs: release
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Publish to crates.io
        run: |
          set -euo pipefail

          crate_version() {
            local manifest="$1"
            awk -F '"' '/^version = "[^"]+"/ { print $2; exit }' "$manifest"
          }

          # crates.io returns 403 to requests without a User-Agent
          crate_available() {
            local crate="$1"
            local version="$2"
            curl --silent --fail \
              --user-agent "agent-spreadsheet-mcp-release (github.com/PSU3D0/agent-spreadsheet)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
          }

          wait_for_crate() {
            local crate="$1"
            local version="$2"
            local attempts=20
            local delay=15

            for ((attempt=1; attempt<=attempts; attempt++)); do
              if crate_available "$crate" "$version"; then
                echo "${crate}@${version} is available on crates.io"
                return 0
              fi
              echo "Waiting for ${crate}@${version} to become available (${attempt}/${attempts})"
              sleep "$delay"
            done

            echo "Timed out waiting for ${crate}@${version} on crates.io"
            return 1
          }

          publish_and_wait() {
            local manifest="$1"
            local crate="$2"
            local version
            version="$(crate_version "$manifest")"

            if crate_available "$crate" "$version"; then
              echo "${crate}@${version} already published; skipping"
              return 0
            fi

            cargo publish --locked --manifest-path "$manifest"
            wait_for_crate "$crate" "$version"
          }

          publish_and_wait crates/agent-spreadsheet-render/Cargo.toml agent-spreadsheet-render
          publish_and_wait crates/agent-spreadsheet/Cargo.toml agent-spreadsheet
          publish_and_wait crates/agent-spreadsheet-mcp/Cargo.toml agent-spreadsheet-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
